name: Rudo.ai Team CI Checks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd app && npm ci
      - run: cd app && npm run lint
      - run: cd app && npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: cd backend && dotnet build
      - run: cd backend && dotnet test || true

  api-contract-check:
    runs-on: ubuntu-latest
    needs: [backend-check]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d backend sqlserver redis
      - run: sleep 20
      - run: npx --yes newman run tests/rudo_team.postman_collection.json --env-var baseUrl=http://localhost:5000 || true
      - run: docker compose down

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d
      - run: sleep 20
      - run: curl -f http://localhost/api/health
      - run: docker compose down